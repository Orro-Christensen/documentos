<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f3b4c">
<meta name="robots" content="noindex, nofollow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Documentos O&amp;C">
<title>Documentos O&amp;C</title>
<link rel="icon" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/icone-180.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="estilo.css?v=7">
</head>
<body>
<div class="marca"><img src="img/logo.png" alt="Orro &amp; Christensen"></div>
<header class="topo">
  <button class="voltar" id="btnVoltar" hidden aria-label="Voltar">‹</button>
  <button id="btnSair" hidden>Sair</button>
  <h1 id="titulo">Documentos O&amp;C</h1>
</header>
<main id="tela"><div class="carregando">Carregando…</div></main>
<div id="modal"></div>

<script src="config.js?v=4"></script>
<script src="lib/pdf.min.js"></script>
<script src="comum.js?v=5"></script>
<script>
const { post, esc, competencia, dataBR, bytesDeBase64, desenharPdf, baixar, aviso } = App;
const $ = s => document.querySelector(s);
const tela = $('#tela');

// Sessão só na memória desta página: fechou ou recarregou, pede a senha de novo.
// Nenhum documento é guardado no aparelho.
let sessao = null;          // { token, nome, docs, avisos }
let consulta = null;        // mês escolhido em "Consultar outro mês" ('2026-09')
let nomes = null;
let estado = { v: 'quem' };
let inativo;

function ir(novo, substituir) {
  estado = novo;
  (substituir ? history.replaceState : history.pushState).call(history, novo, '');
  desenhar(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', e => { estado = e.state || { v: sessao ? 'lista' : 'quem' }; desenhar(); });
$('#btnVoltar').onclick = () => history.back();
$('#btnSair').onclick = () => sair();

function sair(msg) {
  consulta = null;
  if (sessao) post({ action: 'sair', token: sessao.token }).catch(() => {});
  sessao = null; clearTimeout(inativo);
  if (msg) aviso(msg, true);
  ir({ v: 'quem' }, true);
}
// 10 minutos sem mexer: sai sozinho (celular pode ficar largado na bancada).
function mexeu() { clearTimeout(inativo); if (sessao) inativo = setTimeout(() => sair('Saiu por falta de uso. Entre de novo.'), 10 * 60e3); }
['click', 'touchstart', 'keydown', 'scroll'].forEach(ev => addEventListener(ev, mexeu, { passive: true }));

function erroSessao(e) { if (e.sessao) { sair(e.message); return true; } return false; }

function desenhar() {
  const v = sessao ? estado.v : (estado.v === 'senha' ? 'senha' : 'quem');
  $('#btnVoltar').hidden = !['senha', 'ver', 'aviso', 'trocar'].includes(v);
  $('#btnSair').hidden = !sessao;
  $('#titulo').textContent = sessao ? sessao.nome : 'Documentos O&C';
  if (v === 'quem') return telaQuem();
  if (v === 'senha') return telaSenha(estado.nome);
  if (v === 'lista') return telaLista();
  if (v === 'ver') return telaVer(estado.id);
  if (v === 'aviso') return telaAviso(estado.id);
  if (v === 'trocar') return telaTrocar();
}

// ---------- quem é você ----------
async function telaQuem() {
  // Busca a lista sempre que esta tela abre (quem recebeu documento novo aparece sem recarregar a página).
  if (!nomes) tela.innerHTML = '<div class="carregando">Carregando…</div>';
  try { nomes = (await post({ action: 'funcionarios' })).nomes; }
  catch (e) { if (!nomes) { tela.innerHTML = `<div class="vazio-msg">${esc(e.message)}<br><br><button class="btn btn-claro" onclick="location.reload()">Tentar de novo</button></div>`; return; } }
  if (sessao || estado.v === 'senha') return;
  tela.innerHTML = `<div class="titulo">Quem é você?</div>
    ${nomes.length ? `<div class="nomes">${nomes.map(n => `<button class="nome" data-n="${esc(n)}">${esc(n)}</button>`).join('')}</div>`
      : '<div class="vazio-msg">Nenhum funcionário cadastrado.</div>'}
    ${botaoInstalar()}
    <p class="rodape">Seus documentos só aparecem depois da sua senha de 4 números (a mesma do Pede Aí).</p>`;
  ligarInstalar();
  tela.querySelectorAll('.nome').forEach(b => b.onclick = () => ir({ v: 'senha', nome: b.dataset.n }));
}

// ---------- senha ----------
function telaSenha(nome) {
  let pin = '', ocupado = false;
  tela.innerHTML = `<div class="senha-caixa">
    <div class="titulo" style="text-align:center">${esc(nome)}</div>
    <div>Digite sua senha</div>
    <div class="pontos" id="pontos">${'<span></span>'.repeat(4)}</div>
    <div class="teclado">${[1,2,3,4,5,6,7,8,9].map(n => `<button data-k="${n}">${n}</button>`).join('')}
      <button class="vazio"></button><button data-k="0">0</button><button data-k="x" aria-label="Apagar">⌫</button></div>
    <div class="meta" id="msg" style="margin-top:14px;min-height:22px"></div></div>`;
  const pontos = () => $('#pontos').querySelectorAll('span').forEach((s, i) => s.classList.toggle('cheio', i < pin.length));
  tela.querySelectorAll('.teclado [data-k]').forEach(b => b.onclick = async () => {
    if (ocupado) return;
    const k = b.dataset.k;
    if (k === 'x') pin = pin.slice(0, -1); else if (pin.length < 4) pin += k;
    pontos();
    if (pin.length === 4) {
      ocupado = true; $('#msg').textContent = 'Conferindo…';
      try {
        const r = await post({ action: 'login', nome, senha: pin });
        sessao = { token: r.token, nome: r.nome, docs: r.docs, avisos: r.avisos || [] }; mexeu();
        ir({ v: 'lista' }, true);
      } catch (e) {
        pin = ''; pontos(); ocupado = false;
        $('#msg').innerHTML = `<span style="color:var(--perigo)">${esc(e.message)}</span>`;
      }
    }
  });
}

// ---------- lista ----------
const icone = t => /f[ée]rias/i.test(t) ? '🏖️' : /13/.test(t) ? '🎁' : /informe|rendimento/i.test(t) ? '📊' : '🧾';
const TIPO_IR = 'Informe de rendimentos';
const ehIR = d => d.tipo === TIPO_IR;
const quando = d => ehIR(d) ? `Ano-calendário ${d.competencia} · declaração ${+d.competencia + 1}` : competencia(d.competencia);
function botaoDoc(d) {
  return `<button class="doc" data-id="${esc(d.id)}"><span class="ic">${icone(d.tipo)}</span>
    <span class="txt"><b>${esc(d.tipo)}</b><span class="meta">${esc(quando(d))}</span></span>
    ${d.visto ? '' : '<span class="selo">NOVO</span>'}<span class="seta">›</span></button>`;
}
function botaoAviso(a) {
  return `<button class="doc" data-av="${esc(a.id)}"><span class="ic">📢</span>
    <span class="txt"><b>${esc(a.titulo)}</b><span class="meta">${esc(dataBR(a.data).slice(0, 8))}${a.anexo ? ' · 📎 anexo' : ''}</span></span>
    ${a.lido ? '' : '<span class="selo">NOVO</span>'}<span class="seta">›</span></button>`;
}
async function telaLista() {
  const docs = (sessao.docs || []).filter(d => !ehIR(d)), informes = (sessao.docs || []).filter(ehIR), avisos = sessao.avisos || [];
  let h = '';
  if (avisos.length) {
    const novos = avisos.filter(a => !a.lido), lidos = avisos.filter(a => a.lido);
    h += `<div class="titulo">📢 Avisos da empresa</div>${novos.map(botaoAviso).join('')}${lidos.slice(0, novos.length ? 3 : 5).map(botaoAviso).join('')}`;
    if (lidos.length > (novos.length ? 3 : 5)) h += `<details><summary>Avisos antigos (${lidos.length - (novos.length ? 3 : 5)})</summary>${lidos.slice(novos.length ? 3 : 5).map(botaoAviso).join('')}</details>`;
  }
  if (docs.length) {
    const atual = docs[0].competencia;
    const doMes = docs.filter(d => d.competencia === atual), antigos = docs.filter(d => d.competencia !== atual);
    h += `<div class="titulo">🧾 Contra-cheques</div><div class="atual"><div class="rotulo">Mês atual</div>
      <div class="mes">${esc(competencia(atual))}</div>${doMes.map(botaoDoc).join('')}</div>`;
    if (antigos.length) {
      // Consulta por ano e mês (serve para quem tem anos de empresa).
      const meses = [...new Set(antigos.map(d => d.competencia))];          // já vem do mais novo ao mais velho
      if (!consulta || !meses.includes(consulta)) consulta = meses[0];
      const anos = [...new Set(meses.map(m => m.slice(0, 4)))];
      const ano = consulta.slice(0, 4);
      const mesesDoAno = meses.filter(m => m.slice(0, 4) === ano);
      h += `<div class="titulo">🔎 Consultar outro mês</div><div class="consulta">
        <div class="linha2">
          <div><label class="campo">Ano</label><select id="selAno">${anos.map(a => `<option${a === ano ? ' selected' : ''}>${a}</option>`).join('')}</select></div>
          <div><label class="campo">Mês</label><select id="selMes">${mesesDoAno.map(m => `<option value="${m}"${m === consulta ? ' selected' : ''}>${App.MESES[+m.slice(5) - 1]}</option>`).join('')}</select></div>
        </div>
        ${antigos.filter(d => d.competencia === consulta).map(botaoDoc).join('')}</div>`;
    }
  }
  if (informes.length) {
    h += `<div class="titulo">📊 Imposto de Renda</div>${informes.slice().sort((a, b) => b.competencia.localeCompare(a.competencia)).map(botaoDoc).join('')}`;
  }
  if (!h) h = '<div class="vazio-msg" style="margin-top:20px">Você ainda não tem documentos nem avisos aqui.</div>';
  tela.innerHTML = h + `${botaoInstalar()}<button class="btn-senha" id="btnTrocar">🔑 Quero trocar minha senha</button>
    <p class="rodape">Toque no item para abrir. Por segurança, o app sai sozinho depois de 10 minutos parado.</p>`;
  tela.querySelectorAll('[data-id]').forEach(b => b.onclick = () => ir({ v: 'ver', id: b.dataset.id }));
  tela.querySelectorAll('[data-av]').forEach(b => b.onclick = () => ir({ v: 'aviso', id: b.dataset.av }));
  $('#btnTrocar').onclick = () => ir({ v: 'trocar' });
  if ($('#selAno')) $('#selAno').onchange = e => { consulta = docs.map(d => d.competencia).find(c => c !== docs[0].competencia && c.slice(0, 4) === e.target.value); telaLista(); };
  if ($('#selMes')) $('#selMes').onchange = e => { consulta = e.target.value; telaLista(); };
  ligarInstalar();
}

// Botão de instalação (some quando o app já está instalado e aberto pelo ícone)
function botaoInstalar() {
  return App.instalacao.podeMostrar() ? '<button class="btn-instalar" id="btnInstalar">📲 Instalar o app neste celular</button>' : '';
}
function ligarInstalar() { if ($('#btnInstalar')) $('#btnInstalar').onclick = () => App.instalacao.instalar('Documentos O&C'); }

// ---------- ver aviso ----------
async function telaAviso(id) {
  const a = (sessao.avisos || []).find(x => x.id === id);
  if (!a) return ir({ v: 'lista' }, true);
  tela.innerHTML = `<div class="titulo">📢 ${esc(dataBR(a.data).slice(0, 8))}</div><div class="carregando">Abrindo aviso…</div>`;
  try {
    const r = await post({ action: 'abrirAviso', token: sessao.token, id });
    if (estado.v !== 'aviso' || estado.id !== id) return;
    a.lido = true;
    tela.innerHTML = `<div class="titulo">📢 ${esc(dataBR(r.data).slice(0, 8))}</div>
      <div class="aviso-texto"><b style="font-size:20px">${esc(r.titulo)}</b>${r.texto ? '\n\n' + esc(r.texto) : ''}</div>
      ${r.base64 ? `<div class="acoes"><button class="btn btn-ok" id="btnBaixar">⬇ Baixar anexo</button></div><div class="visor" id="visor"></div>` : ''}`;
    if (r.base64) {
      const u8 = bytesDeBase64(r.base64);
      $('#btnBaixar').onclick = () => baixar(u8, r.nomeArquivo || 'anexo', r.mime);
      if (r.mime === 'application/pdf') await desenharPdf(u8, $('#visor'));
      else { const img = new Image(); img.src = URL.createObjectURL(new Blob([u8], { type: r.mime })); $('#visor').appendChild(img); }
    }
  } catch (e) {
    if (erroSessao(e)) return;
    tela.innerHTML = `<div class="vazio-msg">${esc(e.message)}</div>`;
  }
}

// ---------- trocar senha ----------
function telaTrocar() {
  tela.innerHTML = `<div class="senha-caixa" style="max-width:380px">
    <div class="titulo" style="text-align:center">🔑 Trocar minha senha</div>
    <p class="meta" style="text-align:center">A senha nova vale aqui e no Pede Aí. Use 4 números fáceis para você e difíceis para os outros (nada de 1234, 0000 ou ano de nascimento).</p>
    <form id="fs" autocomplete="off">
      <label class="campo">Senha atual</label><input id="sAtual" class="campo-senha" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>
      <label class="campo">Senha nova</label><input id="sNova" class="campo-senha" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>
      <label class="campo">Repita a senha nova</label><input id="sNova2" class="campo-senha" type="password" inputmode="numeric" maxlength="4" pattern="\\d{4}" required>
      <div class="acoes"><button class="btn btn-ok" id="sOk">Trocar senha</button></div>
      <div class="meta" id="sMsg" style="color:var(--perigo);text-align:center;min-height:22px"></div>
    </form></div>`;
  $('#fs').onsubmit = async e => {
    e.preventDefault();
    const atual = $('#sAtual').value.trim(), nova = $('#sNova').value.trim();
    if (!/^\d{4}$/.test(nova)) return $('#sMsg').textContent = 'A senha nova precisa ter 4 números.';
    if (nova !== $('#sNova2').value.trim()) return $('#sMsg').textContent = 'As duas senhas novas não são iguais.';
    $('#sOk').disabled = true; $('#sMsg').textContent = '';
    try {
      await post({ action: 'trocarSenha', token: sessao.token, atual, nova });
      aviso('Senha trocada! Use a nova aqui e no Pede Aí.');
      history.back();
    } catch (err) {
      if (erroSessao(err)) return;
      $('#sMsg').textContent = err.message; $('#sOk').disabled = false;
    }
  };
}

// ---------- resumo do informe de rendimentos (o que vai na declaração) ----------
const QUADROS_IR = { 3: 'Rendimentos tributáveis (ficha "Rendimentos tributáveis recebidos de PJ")',
  4: 'Rendimentos isentos e não tributáveis', 5: 'Rendimentos sujeitos à tributação exclusiva', 6: 'Rendimentos recebidos acumuladamente' };
function resumoIR(x) {
  const por = {}; (x.linhas || []).forEach(l => (por[l.quadro] = por[l.quadro] || []).push(l));
  return `<div class="ir-resumo">
    <div class="ir-fonte"><span class="meta">Fonte pagadora</span><b>${esc(x.fonte || '')}</b><span>CNPJ ${esc(x.cnpj || '')}</span></div>
    ${Object.keys(por).sort().map(q => `<div class="ir-quadro"><div class="ir-q">Quadro ${q} · ${esc(QUADROS_IR[q] || '')}</div>
      ${por[q].map(l => `<div class="ir-linha"><span>${esc(l.item)}. ${esc(l.descricao)}</span><b>R$ ${esc(l.valor)}</b></div>`).join('')}</div>`).join('')}
    ${x.complementares ? `<div class="ir-quadro"><div class="ir-q">Quadro 7 · Informações complementares</div><div class="meta">${esc(x.complementares)}</div></div>` : ''}
    <p class="meta" style="margin:10px 2px 0">Itens que não aparecem estão zerados. Na dúvida, vale o PDF abaixo.</p></div>`;
}

// ---------- ver documento ----------
async function telaVer(id) {
  const d = (sessao.docs || []).find(x => x.id === id);
  if (!d) return ir({ v: 'lista' }, true);
  tela.innerHTML = `<div class="titulo">${esc(d.tipo)} · ${esc(quando(d))}</div>
    ${d.dados ? resumoIR(d.dados) : ''}
    <div class="acoes"><button class="btn btn-ok" id="btnBaixar" disabled>⬇ Baixar PDF</button></div>
    <div class="visor" id="visor"><div class="carregando">Abrindo documento…</div></div>`;
  try {
    const r = await post({ action: 'abrir', token: sessao.token, id });
    if (estado.v !== 'ver' || estado.id !== id) return;
    const u8 = bytesDeBase64(r.base64);
    d.visto = true;
    $('#btnBaixar').disabled = false;
    $('#btnBaixar').onclick = () => baixar(u8, r.nomeArquivo);
    await desenharPdf(u8, $('#visor'));
  } catch (e) {
    if (erroSessao(e)) return;
    $('#visor').innerHTML = `<div class="vazio-msg">${esc(e.message)}</div>`;
  }
}

history.replaceState(estado, '');
desenhar();
</script>
</body>
</html>
