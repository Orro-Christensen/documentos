<script>
const { post, esc, competencia, dataBR, base64DeBytes, pdfjs, aviso } = App;
const $ = s => document.querySelector(s);
const tela = $('#tela');
let token = null, dados = null, aba = 'enviar';

$('#btnSair').onclick = () => { token = null; dados = null; lotes = []; telaPin(); };
const fechar = () => $('#modal').innerHTML = '';
const APP_URL = window.APP_URL || new URL('../', location.href).href;
const matN = m => String(m || '').trim().replace(/^0+(?=\d)/, '');

// Janela de link: endereço + QR Code + copiar + WhatsApp (igual ao Compras do Pede Aí)
$('#btnLink').onclick = () => {
  const msg = `Documentos O&C — seus contra-cheques e avisos da empresa:\n${APP_URL}\n\nAbra no celular, toque no seu nome e digite sua senha (a mesma do Pede Aí). Para instalar: menu do navegador → "Adicionar à tela inicial".`;
  $('#modal').innerHTML = `<div class="fundo-modal" id="fm"><div class="modal">
    <div class="titulo" style="margin-top:0">🔗 Link do app dos funcionários</div>
    <div class="link-app">${esc(APP_URL)}</div><div class="qr" id="qr"></div>
    <p class="meta" style="text-align:center;margin-top:-6px">Aponte a câmera do celular para o QR Code para abrir.</p>
    <div class="pilha"><button class="btn btn-ok" id="lCopiar">📋 Copiar link</button>
      <a class="btn btn-acento" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent(msg)}">📱 Enviar pelo WhatsApp</a>
      <button class="btn btn-claro" id="lX">Fechar</button></div></div></div>`;
  try { const q = qrcode(0, 'M'); q.addData(APP_URL); q.make(); $('#qr').innerHTML = q.createSvgTag({ cellSize: 6, margin: 2, scalable: true }); }
  catch (e) { $('#qr').innerHTML = '<span class="meta">QR Code indisponível</span>'; }
  $('#lCopiar').onclick = () => navigator.clipboard.writeText(APP_URL).then(() => aviso('Link copiado'));
  $('#lX').onclick = fechar; $('#fm').onclick = e => { if (e.target.id === 'fm') fechar(); };
};
// Atalhos de administração
$('#btnAdm').onclick = () => {
  const L = [
    { ic: '🗂️', t: 'Planilha de controle', d: 'Documentos enviados, matrículas, avisos e quem leu', u: dados.planilhaUrl },
    { ic: '📁', t: 'Pasta privada no Drive', d: 'Os PDFs de cada mês e os anexos dos avisos', u: dados.pastaUrl },
    { ic: '👷', t: 'Funcionários e senhas (Pede Aí)', d: 'Aba Funcionarios: nome, ativo e senha de 4 números', u: dados.pedeAiUrl },
    { ic: '⚙️', t: 'Script (Google Apps Script)', d: 'Liga o site ao Drive; funções limparDuplicados, corrigirNome…', u: window.SCRIPT_URL },
    { ic: '📦', t: 'Repositório (GitHub)', d: 'Arquivos do site e manual (LEIA-ME)', u: window.REPO_URL },
  ].filter(l => l.u);
  $('#modal').innerHTML = `<div class="fundo-modal" id="fm"><div class="modal largo">
    <div class="titulo" style="margin-top:0">🛠️ Administrar</div>
    <div class="admin-lista">${L.map(l => `<div class="admin-item"><div class="ic">${l.ic}</div>
      <div class="tx"><b>${esc(l.t)}</b><span>${esc(l.d)}</span></div>
      <a href="${esc(l.u)}" target="_blank" rel="noopener">Abrir</a></div>`).join('')}</div>
    <p class="meta">Planilhas, pasta e script: entre com a conta Google dona da planilha. Repositório: conta do GitHub da organização Orro-Christensen.</p>
    <button class="btn btn-claro" id="aX" style="width:100%">Fechar</button></div></div>`;
  $('#aX').onclick = fechar; $('#fm').onclick = e => { if (e.target.id === 'fm') fechar(); };
};

async function chamar(body, ms) {
  try { return await post(Object.assign({ token }, body), ms); }
  catch (e) { if (e.sessao) { token = null; telaPin(e.message); } throw e; }
}

// ---------- PIN ----------
function telaPin(msg) {
  $('#acoesTopo').hidden = true;
  tela.innerHTML = `<div class="cartao" style="max-width:380px;margin:30px auto">
    <div class="titulo" style="margin-top:0">PIN de administração</div>
    <form id="f"><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN" autofocus>
    <div class="acoes"><button class="btn btn-ok">Entrar</button></div></form>
    <div class="meta" id="msg" style="color:var(--perigo)">${esc(msg || '')}</div></div>`;
  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#msg').textContent = '';
    try { token = (await post({ action: 'adminLogin', pin: $('#pin').value })).token; await carregar(); }
    catch (err) { $('#msg').textContent = err.message; $('#pin').value = ''; }
  };
}

async function carregar() {
  tela.innerHTML = '<div class="carregando">Carregando…</div>';
  dados = await chamar({ action: 'adminDados' });
  $('#acoesTopo').hidden = false;
  desenhar();
}

function desenhar() {
  tela.innerHTML = `<div class="abas">
      <button data-a="enviar" class="${aba === 'enviar' ? 'on' : ''}">🧾 Holerites</button>
      <button data-a="avisos" class="${aba === 'avisos' ? 'on' : ''}">📢 Avisos</button>
      <button data-a="enviados" class="${aba === 'enviados' ? 'on' : ''}">📋 Enviados e vistos</button></div>
    <div id="conteudo"></div>`;
  tela.querySelectorAll('.abas button').forEach(b => b.onclick = () => { aba = b.dataset.a; desenhar(); });
  if (aba === 'enviar') telaEnviar(); else if (aba === 'avisos') telaAvisos(); else telaEnviados();
}

// ---------- leitura do PDF da contabilidade ----------
const TIPOS = ['Holerite', 'Adiantamento', '13º salário', 'Recibo de férias', 'Informe de rendimentos', 'Rescisão'];
function tipoDoTexto(t) {
  t = String(t || '');
  if (/13/.test(t)) return '13º salário';
  if (/f[ée]rias/i.test(t)) return 'Recibo de férias';
  if (/adiant/i.test(t)) return 'Adiantamento';
  if (/rescis/i.test(t)) return 'Rescisão';
  return 'Holerite';
}
const sem = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(Boolean);

// Sugere o funcionário do Pede Aí: 1º pela matrícula já vinculada; 2º pelo nome
// (todas as palavras do nome no Pede Aí aparecem no nome do holerite, e só um funcionário bate).
// Diferença de até 1 letra (Antthony ≈ ANTHONY, Abraâo ≈ ABRAAO).
function parecido(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, dif = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++dif > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return dif + (a.length - i) + (b.length - j) <= 1;
}
function sugerir(matricula, nomeDoc) {
  const m = dados.matriculas.find(x => x.matricula === matN(matricula));
  if (m && m.funcionario && dados.funcionarios.includes(m.funcionario)) return m.funcionario;
  const doc = sem(nomeDoc);
  const tem = x => doc.some(y => parecido(x, y));
  const bate = dados.funcionarios.filter(f => { const p = sem(f); return p.length && p.every(tem); });
  if (bate.length === 1) return bate[0];
  const pp = dados.funcionarios.filter(f => parecido(sem(f)[0] || '', doc[0] || ''));
  return pp.length === 1 ? pp[0] : '';
}

async function lerPdf(arquivo) {
  const bytes = new Uint8Array(await arquivo.arrayBuffer());
  const doc = await pdfjs().getDocument({ data: bytes.slice() }).promise;
  const paginas = []; let comp = '', tipo = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent();
    const txt = tc.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('');
    const m = txt.match(/(?:^|\n)\s*([^\n]*?)\s*\n\s*(\d{5,6})\s+([A-ZÀ-Ý][A-ZÀ-Ý' .-]+?)\s*\n?\s*PIS:/);
    const d = txt.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (!comp && d) comp = d[3] + '-' + d[2];
    if (!tipo && m) tipo = tipoDoTexto(m[1]);
    const matricula = m ? m[2] : '', nomeDoc = m ? m[3].trim() : '';
    const funcionario = matricula ? sugerir(matricula, nomeDoc) : '';
    paginas.push({ pag: n, matricula, nomeDoc, funcionario, enviar: !!(matricula && funcionario) });
  }
  return { nomeArquivo: arquivo.name, bytes, competencia: comp, tipo: tipo || 'Holerite', paginas };
}

// ---------- aba Holerites (um ou vários PDFs de uma vez) ----------
let lotes = [];   // um por arquivo
function telaEnviar() {
  const c = $('#conteudo');
  if (!lotes.length) {
    c.innerHTML = `<label class="arquivo" id="caixa"><input type="file" id="arq" accept="application/pdf,.pdf" multiple>
        <div style="font-size:34px">📄</div><b>Escolher o(s) PDF(s) da contabilidade</b>
        <div class="meta">Pode escolher vários meses de uma vez (segure Ctrl). Cada arquivo é lido aqui no navegador e separado por funcionário.</div></label>
      <p class="meta">Funcionário novo? Cadastre primeiro na aba <b>Funcionarios</b> da planilha do Pede Aí, com a senha de 4 números.</p>`;
    $('#arq').onchange = async e => {
      const fs = [...e.target.files]; if (!fs.length) return;
      const l = [];
      for (let k = 0; k < fs.length; k++) {
        c.innerHTML = `<div class="carregando">Lendo ${k + 1} de ${fs.length}: ${esc(fs[k].name)}…</div>`;
        try { l.push(await lerPdf(fs[k])); } catch (err) { aviso('Não consegui ler ' + fs[k].name + ': ' + err.message, true); }
      }
      lotes = l.sort((a, b) => (a.competencia + a.tipo).localeCompare(b.competencia + b.tipo));
      telaEnviar();
    };
    return;
  }
  const opcoes = sel => '<option value="">— escolher —</option>' + dados.funcionarios.map(f => `<option${f === sel ? ' selected' : ''}>${esc(f)}</option>`).join('');
  const jaExiste = (L, p) => dados.documentos.some(d => d.competencia === L.competencia && d.tipo === L.tipo && d.matricula === matN(p.matricula));
  const chave = L => L.competencia + '|' + L.tipo;
  const repetidos = new Set(lotes.map(chave).filter((k, i, a) => a.indexOf(k) !== i));
  c.innerHTML = lotes.map((L, li) => {
    const ok = L.paginas.filter(p => p.enviar).length, falta = L.paginas.filter(p => !p.funcionario || !p.matricula).length;
    const subst = L.paginas.filter(p => p.enviar && jaExiste(L, p)).length;
    return `<div class="cartao">
      <div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><b>${esc(L.nomeArquivo)}</b> · ${L.paginas.length} página(s)
        <div class="meta"><span class="ok">${ok} para enviar</span>${falta ? ` · <span style="color:var(--acento)">${falta} sem funcionário</span>` : ''}${subst ? ` · ${subst} substituem envio anterior` : ''}</div>
        ${repetidos.has(chave(L)) ? '<div style="color:var(--perigo);font-weight:600">⚠ Outro arquivo tem a mesma competência e tipo. Confira.</div>' : ''}</div>
        ${lotes.length > 1 ? `<button class="mini perigo" data-tira="${li}">Tirar</button>` : ''}</div>
      <div class="linha2">
        <div><label class="campo">Competência</label><input type="month" class="comp" data-l="${li}" value="${esc(L.competencia)}"></div>
        <div><label class="campo">Tipo de documento</label><input class="tipo" data-l="${li}" list="tipos" value="${esc(L.tipo)}"></div>
      </div>
      <details ${lotes.length === 1 || falta ? 'open' : ''}><summary>Ver páginas</summary><div class="tabela-rolagem"><table>
        <thead><tr><th></th><th>Pág.</th><th>Matrícula</th><th>Nome no documento</th><th>Funcionário (Pede Aí)</th><th></th></tr></thead>
        <tbody>${L.paginas.map((p, i) => `<tr class="${p.matricula && p.funcionario ? '' : 'falta'}">
          <td><input type="checkbox" data-l="${li}" data-i="${i}" class="chk" ${p.enviar ? 'checked' : ''} style="width:auto"></td>
          <td>${p.pag}</td>
          <td><input data-l="${li}" data-i="${i}" class="mat" value="${esc(p.matricula)}" style="width:90px" placeholder="?"></td>
          <td>${esc(p.nomeDoc) || '<span class="nao">não identificado</span>'}</td>
          <td><select data-l="${li}" data-i="${i}" class="func">${opcoes(p.funcionario)}</select></td>
          <td>${jaExiste(L, p) ? '<span class="meta">substitui</span>' : ''}</td></tr>`).join('')}</tbody>
      </table></div></details></div>`;
  }).join('') + `<datalist id="tipos">${TIPOS.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
    <div class="meta" id="resumo"></div>
    <div class="progresso" id="prog" hidden><div></div></div>
    <div class="acoes"><button class="btn btn-claro" id="cancelar">Cancelar</button><button class="btn btn-ok" id="enviar"></button></div>`;

  const total = lotes.reduce((s, L) => s + L.paginas.filter(p => p.enviar).length, 0);
  const faltam = lotes.reduce((s, L) => s + L.paginas.filter(p => !p.funcionario || !p.matricula).length, 0);
  $('#enviar').textContent = lotes.length > 1 ? `Enviar ${total} documento(s) de ${lotes.length} arquivos` : `Enviar ${total} documento(s)`;
  $('#enviar').disabled = !total;
  $('#resumo').textContent = faltam ? `${faltam} página(s) sem funcionário escolhido (linhas em laranja) não serão enviadas.` : '';
  const P = x => lotes[x.dataset.l].paginas[x.dataset.i];
  c.querySelectorAll('.comp').forEach(x => x.onchange = () => { lotes[x.dataset.l].competencia = x.value; telaEnviar(); });
  c.querySelectorAll('.tipo').forEach(x => x.onchange = () => { lotes[x.dataset.l].tipo = x.value.trim(); telaEnviar(); });
  c.querySelectorAll('.chk').forEach(x => x.onchange = () => { const p = P(x); p.enviar = x.checked && !!p.funcionario && !!p.matricula; telaEnviar(); });
  c.querySelectorAll('.func').forEach(x => x.onchange = () => { const p = P(x); p.funcionario = x.value; p.enviar = !!(p.funcionario && p.matricula); telaEnviar(); });
  c.querySelectorAll('.mat').forEach(x => x.onchange = () => { const p = P(x); p.matricula = x.value.trim(); if (!p.funcionario) p.funcionario = sugerir(p.matricula, p.nomeDoc); p.enviar = !!(p.funcionario && p.matricula); telaEnviar(); });
  c.querySelectorAll('[data-tira]').forEach(b => b.onclick = () => { lotes.splice(+b.dataset.tira, 1); telaEnviar(); });
  $('#cancelar').onclick = () => { lotes = []; telaEnviar(); };
  $('#enviar').onclick = enviarLotes;
}

async function enviarLotes() {
  for (const L of lotes) {
    if (!/^\d{4}-\d{2}$/.test(L.competencia)) return aviso('Confira a competência de ' + L.nomeArquivo, true);
    if (!L.tipo) return aviso('Informe o tipo de documento de ' + L.nomeArquivo, true);
    const rep = L.paginas.filter(p => p.enviar).map(p => matN(p.matricula)).find((m, i, a) => a.indexOf(m) !== i);
    if (rep) return aviso('A matrícula ' + rep + ' aparece em mais de uma página de ' + L.nomeArquivo, true);
  }
  const total = lotes.reduce((s, L) => s + L.paginas.filter(p => p.enviar).length, 0);
  const meses = lotes.map(L => competencia(L.competencia)).join(', ');
  if (!confirm(`Enviar ${total} documento(s)?\n\n${meses}`)) return;
  $('#enviar').disabled = true; $('#cancelar').disabled = true;
  const prog = $('#prog'); prog.hidden = false;
  const passos = total + lotes.length; let feito = 0;
  const barra = () => prog.firstElementChild.style.width = Math.round(100 * (++feito) / passos) + '%';
  const { PDFDocument } = window.PDFLib;
  let enviados = 0;
  try {
    for (const L of lotes) {
      const lista = L.paginas.filter(p => p.enviar);
      if (!lista.length) continue;
      const original = await PDFDocument.load(L.bytes);
      $('#resumo').textContent = `${competencia(L.competencia)}: guardando o original…`;
      await chamar({ action: 'adminOriginal', competencia: L.competencia, tipo: L.tipo, nomeArquivo: L.nomeArquivo, base64: base64DeBytes(L.bytes) }, 120000);
      barra();
      for (let i = 0; i < lista.length; i++) {
        const p = lista[i];
        const novo = await PDFDocument.create();
        const [pg] = await novo.copyPages(original, [p.pag - 1]);
        novo.addPage(pg);
        $('#resumo').textContent = `${competencia(L.competencia)}: ${i + 1} de ${lista.length} (${p.funcionario})…`;
        await chamar({ action: 'adminEnviar', competencia: L.competencia, tipo: L.tipo, matricula: p.matricula,
          nomeDoc: p.nomeDoc, funcionario: p.funcionario, base64: base64DeBytes(await novo.save()) }, 60000);
        p.enviar = false; enviados++; barra();
      }
    }
    aviso(`${enviados} documento(s) enviados.`);
    lotes = []; aba = 'enviados';
    await carregar();
  } catch (e) {
    aviso('Erro no envio: ' + e.message + ` — ${enviados} já foram. Clique em Enviar de novo para continuar do ponto onde parou.`, true);
    telaEnviar();
  }
}

// ---------- aba Enviados ----------
function telaEnviados() {
  const c = $('#conteudo');
  const funcDe = mat => (dados.matriculas.find(m => m.matricula === matN(mat)) || {}).funcionario || '';
  const grupos = {};
  dados.documentos.forEach(d => { const k = d.competencia + '|' + d.tipo; (grupos[k] = grupos[k] || []).push(d); });
  const chaves = Object.keys(grupos).sort().reverse();
  c.innerHTML = `
    ${dados.bloqueados.length ? `<div class="cartao" style="border:2px solid var(--perigo)"><b>Acessos bloqueados</b> (10 senhas erradas seguidas)
      <table>${dados.bloqueados.map(b => `<tr><td>${esc(b.nome)}</td><td class="meta">${esc(dataBR(b.desde))}</td>
        <td><button class="mini" data-lib="${esc(b.nome)}">Liberar</button></td></tr>`).join('')}</table></div>` : ''}
    <div class="cartao links">
      <a href="${esc(dados.pastaUrl)}" target="_blank" rel="noopener">📁 Pasta privada no Drive</a>
      <a href="${esc(dados.planilhaUrl)}" target="_blank" rel="noopener">🗂️ Planilha de controle</a>
</div>
    ${chaves.length ? chaves.map(k => {
      const l = grupos[k].sort((a, b) => (funcDe(a.matricula) || a.nomeDoc).localeCompare(funcDe(b.matricula) || b.nomeDoc, 'pt-BR'));
      const vistos = l.filter(d => d.vistoEm).length;
      return `<div class="cartao tabela-rolagem"><div class="titulo" style="margin-top:0">${esc(competencia(l[0].competencia))} · ${esc(l[0].tipo)}
          <span class="meta" style="text-transform:none">— ${vistos} de ${l.length} vistos</span></div>
        <table><thead><tr><th>Funcionário</th><th>Matrícula</th><th>Enviado</th><th>Visto pelo funcionário</th><th></th></tr></thead><tbody>
        ${l.map(d => `<tr><td>${esc(funcDe(d.matricula) || '(sem vínculo)')}<div class="meta">${esc(d.nomeDoc)}</div></td>
          <td>${esc(d.matricula.padStart(5, '0'))}</td><td class="meta">${esc(dataBR(d.enviadoEm))}</td>
          <td>${d.vistoEm ? `<span class="ok">✓ ${esc(dataBR(d.vistoEm))}</span>` : '<span class="nao">ainda não</span>'}</td>
          <td><button class="mini perigo" data-exc="${esc(d.id)}">Excluir</button></td></tr>`).join('')}
        </tbody></table></div>`;
    }).join('') : '<div class="vazio-msg">Nenhum documento enviado ainda.</div>'}`;
  c.querySelectorAll('[data-lib]').forEach(b => b.onclick = async () => {
    try { await chamar({ action: 'adminLiberar', nome: b.dataset.lib }); aviso('Liberado'); await carregar(); } catch (e) { aviso(e.message, true); }
  });
  c.querySelectorAll('[data-exc]').forEach(b => b.onclick = async () => {
    if (!confirm('Excluir este documento? O arquivo vai para a lixeira do Drive.')) return;
    try { await chamar({ action: 'adminExcluir', id: b.dataset.exc }); aviso('Excluído'); await carregar(); } catch (e) { aviso(e.message, true); }
  });
}

// ---------- aba Avisos ----------
let anexo = null;   // { base64, mime, nome }
async function lerAnexo(f) {
  if (f.type === 'application/pdf') return { base64: base64DeBytes(new Uint8Array(await f.arrayBuffer())), mime: f.type, nome: f.name };
  if (!/^image\//.test(f.type)) throw new Error('Escolha um PDF ou uma foto');
  // Foto: reduz para no máximo 1600 px (fica leve para abrir no celular).
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  return { base64: base64DeBytes(new Uint8Array(await blob.arrayBuffer())), mime: 'image/jpeg', nome: f.name.replace(/\.[^.]+$/, '') + '.jpg' };
}
function telaAvisos() {
  const c = $('#conteudo');
  c.innerHTML = `<div class="cartao">
      <div class="titulo" style="margin-top:0">Novo aviso</div>
      <label class="campo">Título</label><input id="avTit" maxlength="120" placeholder="Ex.: Feriado de 15 de novembro">
      <label class="campo">Texto</label><textarea id="avTxt" placeholder="Escreva o aviso…"></textarea>
      <label class="campo">Anexo (opcional): PDF ou foto</label>
      <input type="file" id="avArq" accept="application/pdf,image/*">
      <div class="meta" id="avArqInfo"></div>
      <label class="campo">Para quem</label>
      <div class="radio"><label><input type="radio" name="para" value="todos" checked> Todos os funcionários</label>
        <label><input type="radio" name="para" value="alguns"> Escolher</label></div>
      <div class="escolha" id="avQuem" hidden>${dados.funcionarios.map(f => `<label><input type="checkbox" value="${esc(f)}"> ${esc(f)}</label>`).join('')}</div>
      <div class="acoes"><button class="btn btn-ok" id="avEnviar">📢 Publicar aviso</button></div>
    </div>
    <div class="titulo">Avisos publicados</div>
    ${dados.avisos.length ? dados.avisos.map(a => {
      const leram = new Set(a.leram.map(l => l.nome)), faltam = a.para.filter(n => !leram.has(n));
      return `<div class="cartao"><div style="display:flex;gap:10px;align-items:flex-start">
          <div style="flex:1"><b>${esc(a.titulo)}</b><div class="meta">${esc(dataBR(a.data))} · ${a.todos ? 'todos' : esc(a.para.length + ' funcionário(s)')}${a.anexo ? ' · 📎 ' + esc(a.anexo) : ''}</div></div>
          <button class="mini perigo" data-arq="${esc(a.id)}">Arquivar</button></div>
        ${a.texto ? `<div class="meta" style="white-space:pre-wrap;margin-top:8px">${esc(a.texto.length > 220 ? a.texto.slice(0, 220) + '…' : a.texto)}</div>` : ''}
        <div style="margin-top:8px"><span class="ok">Lido por ${a.leram.length} de ${a.para.length}</span></div>
        <details><summary>Ver quem leu</summary>
          <div class="meta" style="margin-top:6px">${a.leram.map(l => `✓ ${esc(l.nome)} (${esc(dataBR(l.em))})`).join('<br>') || 'Ninguém ainda.'}</div>
          ${faltam.length ? `<div class="meta" style="margin-top:6px"><b>Ainda não leram:</b> ${faltam.map(esc).join(', ')}</div>` : ''}
        </details></div>`;
    }).join('') : '<div class="vazio-msg">Nenhum aviso publicado.</div>'}`;
  c.querySelectorAll('input[name=para]').forEach(r => r.onchange = () => { $('#avQuem').hidden = c.querySelector('input[name=para]:checked').value !== 'alguns'; });
  $('#avArq').onchange = async e => {
    const f = e.target.files[0]; anexo = null; $('#avArqInfo').textContent = '';
    if (!f) return;
    try { anexo = await lerAnexo(f); $('#avArqInfo').textContent = '📎 ' + anexo.nome + ' (' + Math.round(anexo.base64.length * 0.75 / 1024) + ' KB)'; }
    catch (err) { aviso(err.message, true); e.target.value = ''; }
  };
  $('#avEnviar').onclick = async () => {
    const titulo = $('#avTit').value.trim(), texto = $('#avTxt').value.trim();
    if (!titulo) return aviso('Escreva o título', true);
    const alguns = c.querySelector('input[name=para]:checked').value === 'alguns';
    const dest = alguns ? [...$('#avQuem').querySelectorAll('input:checked')].map(x => x.value) : 'TODOS';
    if (alguns && !dest.length) return aviso('Escolha pelo menos um funcionário', true);
    if (!confirm(`Publicar "${titulo}" para ${alguns ? dest.length + ' funcionário(s)' : 'todos os funcionários'}?`)) return;
    $('#avEnviar').disabled = true; $('#avEnviar').textContent = 'Publicando…';
    try {
      await chamar(Object.assign({ action: 'adminAviso', titulo, texto, destinatarios: dest },
        anexo ? { base64: anexo.base64, mime: anexo.mime, nomeArquivo: anexo.nome } : {}), 120000);
      anexo = null; aviso('Aviso publicado'); await carregar();
    } catch (e) { aviso(e.message, true); $('#avEnviar').disabled = false; $('#avEnviar').textContent = '📢 Publicar aviso'; }
  };
  c.querySelectorAll('[data-arq]').forEach(b => b.onclick = async () => {
    if (!confirm('Arquivar este aviso? Ele some do app dos funcionários (o registro continua na planilha).')) return;
    try { await chamar({ action: 'adminArquivarAviso', id: b.dataset.arq }); aviso('Arquivado'); await carregar(); } catch (e) { aviso(e.message, true); }
  });
}
