async function chamar(body, ms) {
  try { return await post(Object.assign({ token }, body), ms); }
  catch (e) { if (e.sessao) { token = null; telaPin(e.message); } throw e; }
}

// ---------- PIN ----------

  $('#acoesTopo').hidden = true;
  tela.innerHTML = `<div class="cartao" style="max-width:380px;margin:30px auto">

    <div class="acoes"><button class="btn btn-ok">Entrar</button></div></form>

  $('#f').onsubmit = async e => {
    e.preventDefault(); $('#msg').textContent = '';
    try { token = (await post({ action: 'adminLogin', pin: $('#pin').value })).token; await carregar(); }

}

      <button data-a="enviar" class="${aba === 'enviar' ? 'on' : ''}">🧾 Holerites</button>

      <button data-a="epi" class="${aba === 'epi' ? 'on' : ''}">🦺 EPI</button>
      <button data-a="enviados" class="${aba === 'enviados' ? 'on' : ''}">📋 Enviados e vistos</button></div>
    <div id="conteudo"></div>`;
  tela.querySelectorAll('.abas button').forEach(b => b.onclick = () => { aba = b.dataset.a; desenhar(); });
  if (aba === 'enviar') telaEnviar(); else if (aba === 'avisos') telaAvisos(); else if (aba === 'ir') telaIR(); else if (aba === 'cad') telaCad(); else if (aba === 'epi') telaEpi(); else telaEnviados();
}

// ---------- leitura do PDF da contabilidade ----------
const TIPOS = ['Holerite', 'Adiantamento', '13º salário', 'Recibo de férias', 'Informe de rendimentos', 'Rescisão'];
function tipoDoTexto(t) {
  t = String(t || '');
  if (/13/.test(t)) return '13º salário';
  if (/f[ée]rias/i.test(t)) return 'Recibo de férias';
  if (/adiant/i.test(t)) return 'Adiantamento';
  if (/rescis/i.test(t)) return 'Rescisão';
  return 'Holerite';
}
const sem = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().replace(/[^A-Z ]/g, ' ').split(/\s+/).filter(Boolean);

// Sugere o funcionário do Pede Aí: 1º pela matrícula já vinculada; 2º pelo nome
// (todas as palavras do nome no Pede Aí aparecem no nome do holerite, e só um funcionário bate).
// Diferença de até 1 letra (Antthony ≈ ANTHONY, Abraâo ≈ ABRAAO).
function parecido(a, b) {
  if (a === b) return true;
  if (Math.abs(a.length - b.length) > 1) return false;
  let i = 0, j = 0, dif = 0;
  while (i < a.length && j < b.length) {
    if (a[i] === b[j]) { i++; j++; continue; }
    if (++dif > 1) return false;
    if (a.length > b.length) i++; else if (b.length > a.length) j++; else { i++; j++; }
  }
  return dif + (a.length - i) + (b.length - j) <= 1;
}
function sugerir(matricula, nomeDoc) {
  const m = dados.matriculas.find(x => x.matricula === matN(matricula));
  if (m && m.funcionario && dados.funcionarios.includes(m.funcionario)) return m.funcionario;
  const doc = sem(nomeDoc);
  const tem = x => doc.some(y => parecido(x, y));
  const bate = dados.funcionarios.filter(f => { const p = sem(f); return p.length && p.every(tem); });
  if (bate.length === 1) return bate[0];
  const pp = dados.funcionarios.filter(f => parecido(sem(f)[0] || '', doc[0] || ''));
  return pp.length === 1 ? pp[0] : '';
}

async function lerPdf(arquivo) {
  const bytes = new Uint8Array(await arquivo.arrayBuffer());
  const doc = await pdfjs().getDocument({ data: bytes.slice() }).promise;
  const paginas = []; let comp = '', tipo = '';
  for (let n = 1; n <= doc.numPages; n++) {
    const tc = await (await doc.getPage(n)).getTextContent();
    const txt = tc.items.map(x => x.str + (x.hasEOL ? '\n' : ' ')).join('');
    const m = txt.match(/(?:^|\n)\s*([^\n]*?)\s*\n\s*(\d{5,6})\s+([A-ZÀ-Ý][A-ZÀ-Ý' .-]+?)\s*\n?\s*PIS:/);
    const d = txt.match(/(\d{2})\/(\d{2})\/(\d{4})/);
    if (!comp && d) comp = d[3] + '-' + d[2];
    if (!tipo && m) tipo = tipoDoTexto(m[1]);
    const matricula = m ? m[2] : '', nomeDoc = m ? m[3].trim() : '';
    const funcionario = matricula ? sugerir(matricula, nomeDoc) : '';
    paginas.push({ pag: n, matricula, nomeDoc, funcionario, enviar: !!(matricula && funcionario) });
  }
  return { nomeArquivo: arquivo.name, bytes, competencia: comp, tipo: tipo || 'Holerite', paginas };
}

// ---------- aba Holerites (um ou vários PDFs de uma vez) ----------
let lotes = [];   // um por arquivo
function telaEnviar() {
  const c = $('#conteudo');
  if (!lotes.length) {
    c.innerHTML = `<label class="arquivo" id="caixa"><input type="file" id="arq" accept="application/pdf,.pdf" multiple>
        <div style="font-size:34px">📄</div><b>Escolher o(s) PDF(s) da contabilidade</b>
        <div class="meta">Pode escolher vários meses de uma vez (segure Ctrl). Cada arquivo é lido aqui no navegador e separado por funcionário.</div></label>
      <p class="meta">Funcionário novo? Cadastre primeiro na aba <b>Funcionarios</b> da planilha do Pede Aí, com a senha de 4 números.</p>`;
    $('#arq').onchange = async e => {
      const fs = [...e.target.files]; if (!fs.length) return;
      const l = [];
      for (let k = 0; k < fs.length; k++) {
        c.innerHTML = `<div class="carregando">Lendo ${k + 1} de ${fs.length}: ${esc(fs[k].name)}…</div>`;
        try { l.push(await lerPdf(fs[k])); } catch (err) { aviso('Não consegui ler ' + fs[k].name + ': ' + err.message, true); }
      }
      lotes = l.sort((a, b) => (a.competencia + a.tipo).localeCompare(b.competencia + b.tipo));
      telaEnviar();
    };
    return;
  }
  const opcoes = sel => '<option value="">— escolher —</option>' + dados.funcionarios.map(f => `<option${f === sel ? ' selected' : ''}>${esc(f)}</option>`).join('');
  const jaExiste = (L, p) => dados.documentos.some(d => d.competencia === L.competencia && d.tipo === L.tipo && d.matricula === matN(p.matricula));
  const chave = L => L.competencia + '|' + L.tipo;
  const repetidos = new Set(lotes.map(chave).filter((k, i, a) => a.indexOf(k) !== i));
  c.innerHTML = lotes.map((L, li) => {
    const ok = L.paginas.filter(p => p.enviar).length, falta = L.paginas.filter(p => !p.funcionario || !p.matricula).length;
    const subst = L.paginas.filter(p => p.enviar && jaExiste(L, p)).length;
    return `<div class="cartao">
      <div style="display:flex;gap:10px;align-items:flex-start"><div style="flex:1"><b>${esc(L.nomeArquivo)}</b> · ${L.paginas.length} página(s)
        <div class="meta"><span class="ok">${ok} para enviar</span>${falta ? ` · <span style="color:var(--acento)">${falta} sem funcionário</span>` : ''}${subst ? ` · ${subst} substituem envio anterior` : ''}</div>
        ${repetidos.has(chave(L)) ? '<div style="color:var(--perigo);font-weight:600">⚠ Outro arquivo tem a mesma competência e tipo. Confira.</div>' : ''}</div>
        ${lotes.length > 1 ? `<button class="mini perigo" data-tira="${li}">Tirar</button>` : ''}</div>
      <div class="linha2">
        <div><label class="campo">Competência</label><input type="month" class="comp" data-l="${li}" value="${esc(L.competencia)}"></div>
        <div><label class="campo">Tipo de documento</label><input class="tipo" data-l="${li}" list="tipos" value="${esc(L.tipo)}"></div>
      </div>
      <details ${lotes.length === 1 || falta ? 'open' : ''}><summary>Ver páginas</summary><div class="tabela-rolagem"><table>
        <thead><tr><th></th><th>Pág.</th><th>Matrícula</th><th>Nome no documento</th><th>Funcionário (Pede Aí)</th><th></th></tr></thead>
        <tbody>${L.paginas.map((p, i) => `<tr class="${p.matricula && p.funcionario ? '' : 'falta'}">
          <td><input type="checkbox" data-l="${li}" data-i="${i}" class="chk" ${p.enviar ? 'checked' : ''} style="width:auto"></td>
          <td>${p.pag}</td>
          <td><input data-l="${li}" data-i="${i}" class="mat" value="${esc(p.matricula)}" style="width:90px" placeholder="?"></td>
          <td>${esc(p.nomeDoc) || '<span class="nao">não identificado</span>'}</td>
          <td><select data-l="${li}" data-i="${i}" class="func">${opcoes(p.funcionario)}</select></td>
          <td>${jaExiste(L, p) ? '<span class="meta">substitui</span>' : ''}</td></tr>`).join('')}</tbody>
      </table></div></details></div>`;
  }).join('') + `<datalist id="tipos">${TIPOS.map(t => `<option value="${esc(t)}">`).join('')}</datalist>
    <div class="meta" id="resumo"></div>
    <div class="progresso" id="prog" hidden><div></div></div>
    <div class="acoes"><button class="btn btn-claro" id="cancelar">Cancelar</button><button class="btn btn-ok" id="enviar"></button></div>`;

  const total = lotes.reduce((s, L) => s + L.paginas.filter(p => p.enviar).length, 0);
  const faltam = lotes.reduce((s, L) => s + L.paginas.filter(p => !p.funcionario || !p.matricula).length, 0);
  $('#enviar').textContent = lotes.length > 1 ? `Enviar ${total} documento(s) de ${lotes.length} arquivos` : `Enviar ${total} documento(s)`;
  $('#enviar').disabled = !total;
  $('#resumo').textContent = faltam ? `${faltam} página(s) sem funcionário escolhido (linhas em laranja) não serão enviadas.` : '';
  const P = x => lotes[x.dataset.l].paginas[x.dataset.i];
  c.querySelectorAll('.comp').forEach(x => x.onchange = () => { lotes[x.dataset.l].competencia = x.value; telaEnviar(); });
  c.querySelectorAll('.tipo').forEach(x => x.onchange = () => { lotes[x.dataset.l].tipo = x.value.trim(); telaEnviar(); });
  c.querySelectorAll('.chk').forEach(x => x.onchange = () => { const p = P(x); p.enviar = x.checked && !!p.funcionario && !!p.matricula; telaEnviar(); });
  c.querySelectorAll('.func').forEach(x => x.onchange = () => { const p = P(x); p.funcionario = x.value; p.enviar = !!(p.funcionario && p.matricula); telaEnviar(); });
  c.querySelectorAll('.mat').forEach(x => x.onchange = () => { const p = P(x); p.matricula = x.value.trim(); if (!p.funcionario) p.funcionario = sugerir(p.matricula, p.nomeDoc); p.enviar = !!(p.funcionario && p.matricula); telaEnviar(); });
  c.querySelectorAll('[data-tira]').forEach(b => b.onclick = () => { lotes.splice(+b.dataset.tira, 1); telaEnviar(); });
  $('#cancelar').onclick = () => { lotes = []; telaEnviar(); };
  $('#enviar').onclick = enviarLotes;
}

async function enviarLotes() {
  for (const L of lotes) {
    if (!/^\d{4}-\d{2}$/.test(L.competencia)) return aviso('Confira a competência de ' + L.nomeArquivo, true);
    if (!L.tipo) return aviso('Informe o tipo de documento de ' + L.nomeArquivo, true);
    const rep = L.paginas.filter(p => p.enviar).map(p => matN(p.matricula)).find((m, i, a) => a.indexOf(m) !== i);
    if (rep) return aviso('A matrícula ' + rep + ' aparece em mais de uma página de ' + L.nomeArquivo, true);
  }
  const total = lotes.reduce((s, L) => s + L.paginas.filter(p => p.enviar).length, 0);
  const meses = lotes.map(L => competencia(L.competencia)).join(', ');
  if (!confirm(`Enviar ${total} documento(s)?\n\n${meses}`)) return;
  $('#enviar').disabled = true; $('#cancelar').disabled = true;
  const prog = $('#prog'); prog.hidden = false;
  const passos = total + lotes.length; let feito = 0;
  const barra = () => prog.firstElementChild.style.width = Math.round(100 * (++feito) / passos) + '%';
  const { PDFDocument } = window.PDFLib;
  let enviados = 0;
  try {
    for (const L of lotes) {
      const lista = L.paginas.filter(p => p.enviar);
      if (!lista.length) continue;
      const original = await PDFDocument.load(L.bytes);
      $('#resumo').textContent = `${competencia(L.competencia)}: guardando o original…`;
      await chamar({ action: 'adminOriginal', competencia: L.competencia, tipo: L.tipo, nomeArquivo: L.nomeArquivo, base64: base64DeBytes(L.bytes) }, 120000);
      barra();
      for (let i = 0; i < lista.length; i++) {
        const p = lista[i];
        const novo = await PDFDocument.create();
        const [pg] = await novo.copyPages(original, [p.pag - 1]);
        novo.addPage(pg);
        $('#resumo').textContent = `${competencia(L.competencia)}: ${i + 1} de ${lista.length} (${p.funcionario})…`;
        await chamar({ action: 'adminEnviar', competencia: L.competencia, tipo: L.tipo, matricula: p.matricula,
          nomeDoc: p.nomeDoc, funcionario: p.funcionario, base64: base64DeBytes(await novo.save()) }, 60000);
        p.enviar = false; enviados++; barra();
      }
    }
    aviso(`${enviados} documento(s) enviados.`);
    lotes = []; aba = 'enviados';
    await carregar();
  } catch (e) {
    aviso('Erro no envio: ' + e.message + ` — ${enviados} já foram. Clique em Enviar de novo para continuar do ponto onde parou.`, true);
    telaEnviar();
  }
}

// ---------- aba Enviados ----------
function telaEnviados() {
  const c = $('#conteudo');
  const funcDe = mat => (dados.matriculas.find(m => m.matricula === matN(mat)) || {}).funcionario || '';
  const grupos = {};
  const mensais = dados.documentos.filter(d => d.competencia.length === 7);
  mensais.forEach(d => { const k = d.competencia + '|' + d.tipo; (grupos[k] = grupos[k] || []).push(d); });
  // Último mês em destaque; os anteriores por escolha de ano/mês (a lista não cresce com os anos).
  const meses = [...new Set(mensais.map(d => d.competencia))].sort().reverse();
  if (!consultaAdm || !meses.slice(1).includes(consultaAdm)) consultaAdm = meses[1];
  const anos = [...new Set(meses.slice(1).map(m => m.slice(0, 4)))];
  const anoSel = (consultaAdm || '').slice(0, 4);
  const grupoHTML = comp => Object.keys(grupos).filter(k => k.startsWith(comp + '|')).sort((a, b) => (/\|Holerite$/.test(b) - /\|Holerite$/.test(a)) || a.localeCompare(b)).map(k => {
      const l = grupos[k].sort((a, b) => (funcDe(a.matricula) || a.nomeDoc).localeCompare(funcDe(b.matricula) || b.nomeDoc, 'pt-BR'));
      const vistos = l.filter(d => d.vistoEm).length;
      return `<div class="cartao tabela-rolagem"><div class="titulo" style="margin-top:0">${esc(competencia(l[0].competencia))} · ${esc(l[0].tipo)}
          <span class="meta" style="text-transform:none">— ${vistos} de ${l.length} vistos</span></div>
        <table><thead><tr><th>Funcionário</th><th>Matrícula</th><th>Enviado</th><th>Visto pelo funcionário</th><th></th></tr></thead><tbody>
        ${l.map(d => `<tr><td>${esc(funcDe(d.matricula) || '(sem vínculo)')}<div class="meta">${esc(d.nomeDoc)}</div></td>
          <td>${esc(d.matricula.padStart(5, '0'))}</td><td class="meta">${esc(dataBR(d.enviadoEm))}</td>
          <td>${d.vistoEm ? `<span class="ok">✓ ${esc(dataBR(d.vistoEm))}</span>` : '<span class="nao">ainda não</span>'}</td>
          <td><button class="mini perigo" data-exc="${esc(d.id)}">Excluir</button></td></tr>`).join('')}
        </tbody></table></div>`;
    }).join('');
  c.innerHTML = `

let anexo = null;   // { base64, mime, nome }
async function lerAnexo(f) {
  if (f.type === 'application/pdf') return { base64: base64DeBytes(new Uint8Array(await f.arrayBuffer())), mime: f.type, nome: f.name };
  if (!/^image\//.test(f.type)) throw new Error('Escolha um PDF ou uma foto');
  // Foto: reduz para no máximo 1600 px (fica leve para abrir no celular).
  const img = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(img.width, img.height));
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.85));
  return { base64: base64DeBytes(new Uint8Array(await blob.arrayBuffer())), mime: 'image/jpeg', nome: f.name.replace(/\.[^.]+$/, '') + '.jpg' };
}

function ligarExcluir(c) {
  c.querySelectorAll('[data-exc]').forEach(b => b.onclick = async () => {
    if (!confirm('Excluir este documento? O arquivo vai para a lixeira do Drive.')) return;
    try { await chamar({ action: 'adminExcluir', id: b.dataset.exc }); aviso('Excluído'); await carregar(); } catch (e) { aviso(e.message, true); }
  });
}
async function enviarIR() {
  if (!/^\d{4}$/.test(ir.ano)) return aviso('Confira o ano-calendário (4 números)', true);
  const lista = ir.pessoas.filter(p => p.enviar);
  const rep = lista.map(p => matN(p.matricula)).find((m, i, a) => a.indexOf(m) !== i);
  if (rep) return aviso('A matrícula ' + rep + ' aparece em mais de uma pessoa.', true);
  if (!confirm(`Enviar ${lista.length} informe(s) de rendimentos do ano-calendário ${ir.ano}?`)) return;
  $('#irEnviar').disabled = true; $('#irCancelar').disabled = true;
  const prog = $('#prog'); prog.hidden = false;
  const barra = k => prog.firstElementChild.style.width = Math.round(100 * k / (lista.length + 1)) + '%';
  const { PDFDocument } = window.PDFLib;
  let feitos = 0;
  try {
    const original = await PDFDocument.load(ir.bytes);
    await chamar({ action: 'adminOriginal', competencia: ir.ano, tipo: TIPO_IR, nomeArquivo: ir.nomeArquivo, base64: base64DeBytes(ir.bytes) }, 120000);
    barra(1);
    for (const p of lista) {
      const novo = await PDFDocument.create();
      (await novo.copyPages(original, p.paginas.map(n => n - 1))).forEach(pg => novo.addPage(pg));
      $('#resumo').textContent = `Enviando ${feitos + 1} de ${lista.length}: ${p.funcionario}…`;
      await chamar({ action: 'adminEnviar', competencia: ir.ano, tipo: TIPO_IR, matricula: p.matricula, nomeDoc: p.nome, funcionario: p.funcionario,
        base64: base64DeBytes(await novo.save()),
        dados: { ano: ir.ano, fonte: p.fonte, cnpj: p.cnpj, linhas: p.linhas, complementares: p.complementares || '' } }, 60000);
      p.enviar = false; feitos++; barra(feitos + 1);
    }
    aviso(`${feitos} informe(s) enviados.`);
    ir = null; await carregar();
  } catch (e) {
    aviso('Erro no envio: ' + e.message + ` — ${feitos} já foram. Clique em Enviar de novo para continuar.`, true);
    telaIR();
  }
}

      <tbody>${lista.map(f => `<tr data-m="${esc(f.matricula)}" style="cursor:pointer">
        <td><b>${esc(f.nome)}</b>${f.pedeAi ? `<div class="meta">Pede Aí: ${esc(f.pedeAi)}</div>` : ''}${f.demissao ? '<div class="meta" style="color:var(--perigo)">Desligado em ' + esc(f.demissao) + '</div>' : ''}</td>
        <td>${esc(f.matricula)}</td><td>${esc(f.cargo || '')}</td><td>${esc(f.admissao || '')}</td><td>${esc(f.celular || '') || '<span class="nao">—</span>'}</td></tr>`).join('')}</tbody>
      </table>${!lista.length ? '<p class="meta">Nenhum funcionário encontrado.</p>' : ''}</div>
      <p class="meta">${lista.length} de ${cad.length} funcionário(s). Toque no nome para ver a ficha.</p>`
    : '<div class="vazio-msg">Nenhum funcionário cadastrado. Use <b>⬆ Importar fichas (PDF)</b> com a ficha de registro que a contabilidade manda, ou <b>➕ Novo funcionário</b>.</div>'}`;
  const b = $('#cadBusca');
  b.oninput = () => { cadVista.busca = b.value; const pos = b.selectionStart; telaCad().then(() => { const n = $('#cadBusca'); n.focus(); n.setSelectionRange(pos, pos); }); };
  if ($('#cadDesl')) $('#cadDesl').onchange = e => { cadVista.desligados = e.target.checked; telaCad(); };
  c.querySelectorAll('tr[data-m]').forEach(tr => tr.onclick = () => { cadVista = Object.assign(cadVista, { v: 'ver', m: tr.dataset.m, alt: null }); telaCad(); });
  $('#cadNovo').onclick = () => { cadVista = Object.assign(cadVista, { v: 'novo', m: null }); telaCad(); };
  $('#cadImp').onclick = () => { cadVista.v = 'importar'; cadImp = null; telaCad(); };
}

function telaCadFicha() {
  const c = $('#conteudo');
  const novo = cadVista.v === 'novo', editar = novo || cadVista.v === 'editar';
  const f = novo ? {} : cad.find(x => x.matricula === cadVista.m);
  if (!f) { cadVista.v = 'lista'; return telaCad(); }
  const val = k => f[k] || '';
  const celula = ([k, rot, larg, tipo]) => `<div class="cad-campo" style="grid-column:span ${larg || 1}"><label>${esc(rot)}</label>${editar
      ? (tipo === 'area' ? `<textarea data-k="${k}" rows="3">${esc(val(k))}</textarea>` : `<input data-k="${k}" value="${esc(val(k))}">`)
      : `<div class="cad-valor${tipo === 'area' ? ' area' : ''}">${val(k) ? esc(tipo === 'area' ? val(k).split(' | ').join('\n') : val(k)) : '<span class="nao">—</span>'}</div>`}</div>`;
  c.innerHTML = `<div class="cartao cad-topo">
      <button class="mini" id="cadVoltar">‹ Voltar à lista</button>
      <div style="flex:1;min-width:200px"><div style="font-size:20px;font-weight:700">${esc(novo ? 'Novo funcionário' : f.nome)}</div>
        ${novo ? '' : `<div class="meta">Matrícula ${esc(f.matricula)}${f.cargo ? ' · ' + esc(f.cargo) : ''}${f.pedeAi ? ' · Pede Aí: ' + esc(f.pedeAi) : ''}${f.atualizado_em ? ' · atualizado em ' + esc(dataBR(f.atualizado_em)) : ''}</div>`}</div>
      ${editar ? '<button class="btn btn-claro" id="cadCancelar" style="flex:none">Cancelar</button><button class="btn btn-ok" id="cadSalvar" style="flex:none">💾 Salvar</button>'
        : `${f.temFicha ? '<button class="mini" id="cadPdf">📄 Ficha completa (PDF)</button>' : ''}<button class="btn btn-ok" id="cadEditar" style="flex:none">✏️ Editar</button>`}
    </div>
    ${novo ? `<div class="cartao"><div class="cad-grade"><div class="cad-campo"><label>Matrícula (número da folha)</label><input id="cadMat" inputmode="numeric" placeholder="ex.: 00079"></div></div></div>` : ''}
    ${SECOES.map(sec => `<div class="cartao"><div class="titulo" style="margin-top:0">${sec.t}</div><div class="cad-grade">${sec.c.map(celula).join('')}</div></div>`).join('')}
    ${novo ? '' : `<details class="cartao" id="cadAlt"><summary>🕓 Histórico de alterações${f.alteracoes ? ' (' + f.alteracoes + ')' : ''}</summary><div id="cadAltLista" class="meta" style="margin-top:8px">Carregando…</div></details>`}
    <div id="cadPdfVisor"></div>`;
  $('#cadVoltar').onclick = () => { if (editar && !confirm('Sair sem salvar?')) return; cadVista.v = 'lista'; telaCad(); };
  if (editar) {
    $('#cadCancelar').onclick = () => { cadVista.v = novo ? 'lista' : 'ver'; telaCad(); };
    $('#cadSalvar').onclick = async () => {
      const dados = {};
      c.querySelectorAll('[data-k]').forEach(i => { const k = i.dataset.k, v = i.value.trim(); if (novo ? v : v !== (f[k] || '')) dados[k] = v; });
      const mat = novo ? $('#cadMat').value.trim() : f.matricula;
      if (novo && !/^\d{1,10}$/.test(mat)) return aviso('Informe a matrícula (só números)', true);
      if (!dados.nome && novo) return aviso('Informe o nome', true);
      if (!novo && !Object.keys(dados).length) { cadVista.v = 'ver'; return telaCad(); }
      $('#cadSalvar').disabled = true;
      try {
        const r = await chamar({ action: 'cadSalvar', matricula: mat, dados, novo });
        aviso(novo ? 'Funcionário cadastrado' : `${r.alterados} campo(s) alterado(s)`);
        await carregarCad(); cadVista = Object.assign(cadVista, { v: 'ver', m: r.matricula }); telaCad();
      } catch (e) { aviso(e.message, true); $('#cadSalvar').disabled = false; }
    };
  } else {
    $('#cadEditar').onclick = () => { cadVista.v = 'editar'; telaCad(); };
    if ($('#cadPdf')) $('#cadPdf').onclick = async () => {
      const v = $('#cadPdfVisor'); v.innerHTML = '<div class="carregando">Abrindo a ficha…</div>';
      try {
        const r = await chamar({ action: 'cadFicha', matricula: f.matricula });
        const u8 = App.bytesDeBase64(r.base64);
        v.innerHTML = `<div class="acoes"><button class="btn btn-ok" id="cadBaixar">⬇ Baixar ficha</button></div><div class="visor" id="cadVisor"></div>`;
        $('#cadBaixar').onclick = () => App.baixar(u8, r.nomeArquivo);
        await App.desenharPdf(u8, $('#cadVisor')); v.scrollIntoView({ behavior: 'smooth' });
      } catch (e) { v.innerHTML = `<div class="vazio-msg">${esc(e.message)}</div>`; }
    };
    $('#cadAlt').ontoggle = async e => {
      if (!e.target.open || cadVista.alt) return;
      try {
        cadVista.alt = (await chamar({ action: 'cadVer', matricula: f.matricula })).alteracoes;
        $('#cadAltLista').innerHTML = cadVista.alt.length ? `<table><thead><tr><th>Quando</th><th>Campo</th><th>De</th><th>Para</th><th>Origem</th></tr></thead><tbody>
          ${cadVista.alt.map(a => `<tr><td>${esc(dataBR(a.em))}</td><td>${esc(ROTULO[a.campo] || a.campo)}</td><td>${esc(a.de) || '—'}</td><td>${esc(a.para) || '—'}</td><td>${esc(a.origem)}</td></tr>`).join('')}</tbody></table>` : 'Nenhuma alteração registrada.';
      } catch (err) { $('#cadAltLista').textContent = err.message; }
    };
  }
}

function telaCadImportar() {
  const c = $('#conteudo');
  const voltar = '<button class="mini" id="cadVoltar">‹ Voltar à lista</button>';
  if (!cadImp) {
    c.innerHTML = `<div class="cartao">${voltar}</div>
      <label class="arquivo"><input type="file" id="arqFicha" accept="application/pdf,.pdf">
        <div style="font-size:34px">👷</div><b>Escolher o PDF da Ficha de Registro de Empregado</b>
        <div class="meta">O relatório da contabilidade com a ficha de todos os funcionários. É lido aqui no navegador; os dados e a ficha de cada um vão para a pasta privada.</div></label>
      <p class="meta">Importar de novo atualiza só o que veio preenchido no PDF: telefone, contato de emergência e outros campos preenchidos à mão não são apagados. Toda mudança fica no histórico de alterações.</p>`;
    $('#cadVoltar').onclick = () => { cadVista.v = 'lista'; telaCad(); };
    $('#arqFicha').onchange = async e => {
      const f = e.target.files[0]; if (!f) return;
      c.innerHTML = '<div class="carregando">Lendo as fichas…</div>';
      try {
        const bytes = new Uint8Array(await f.arrayBuffer());
        const r = await FICHA.lerFichas(bytes);
        if (!r.pessoas.length) throw new Error('não encontrei nenhuma ficha de registro neste PDF');
        r.pessoas.forEach(p => {
          p.mat = String(p.codigo || '').padStart(5, '0');
          const atual = cad.find(x => matN(x.matricula) === matN(p.mat));
          const dados = {}; Object.keys(ROTULO).concat(['nome']).forEach(k => { if (p[k]) dados[k] = p[k]; });
          p.dados = dados;
          p.muda = atual ? Object.keys(dados).filter(k => dados[k] !== (atual[k] || '')).length : null;
          p.enviar = !!p.codigo && (p.muda === null || p.muda > 0);
        });
        cadImp = { nomeArquivo: f.name, bytes, pessoas: r.pessoas };
      } catch (err) { aviso('Não consegui ler o PDF: ' + err.message, true); cadImp = null; }
      telaCadImportar();
    };
    return;
  }
  const n = cadImp.pessoas.filter(p => p.enviar).length;
  c.innerHTML = `<div class="cartao">${voltar} <b style="margin-left:8px">${esc(cadImp.nomeArquivo)}</b> · ${cadImp.pessoas.length} ficha(s)</div>
    <div class="cartao tabela-rolagem"><table><thead><tr><th></th><th>Págs.</th><th>Matrícula</th><th>Nome</th><th>Cargo</th><th>Situação</th></tr></thead><tbody>
      ${cadImp.pessoas.map((p, i) => `<tr><td><input type="checkbox" class="fiChk" data-i="${i}" ${p.enviar ? 'checked' : ''} style="width:auto"></td>
        <td>${p.paginas[0]}–${p.paginas[p.paginas.length - 1]}</td><td>${esc(p.mat)}</td><td>${esc(p.nome)}</td><td>${esc(p.cargo || '')}</td>
        <td>${p.muda === null ? '<span class="ok">novo</span>' : p.muda ? `atualiza ${p.muda} campo(s)` : '<span class="nao">sem mudança</span>'}</td></tr>`).join('')}
    </tbody></table></div>
    <div class="meta" id="resumo"></div><div class="progresso" id="prog" hidden><div></div></div>
    <div class="acoes"><button class="btn btn-claro" id="fiCancelar">Cancelar</button><button class="btn btn-ok" id="fiEnviar" ${n ? '' : 'disabled'}>Importar ${n} ficha(s)</button></div>`;
  $('#cadVoltar').onclick = () => { cadVista.v = 'lista'; cadImp = null; telaCad(); };
  $('#fiCancelar').onclick = () => { cadImp = null; telaCadImportar(); };
  c.querySelectorAll('.fiChk').forEach(x => x.onchange = () => { cadImp.pessoas[x.dataset.i].enviar = x.checked; telaCadImportar(); });
  $('#fiEnviar').onclick = async () => {
    const lista = cadImp.pessoas.filter(p => p.enviar);
    if (!confirm(`Importar ${lista.length} ficha(s)?`)) return;
    $('#fiEnviar').disabled = true; $('#fiCancelar').disabled = true;
    const prog = $('#prog'); prog.hidden = false;
    const { PDFDocument } = window.PDFLib;
    let k = 0;
    try {
      const original = await PDFDocument.load(cadImp.bytes);
      for (const p of lista) {
        const novo = await PDFDocument.create();
        (await novo.copyPages(original, p.paginas.map(n => n - 1))).forEach(pg => novo.addPage(pg));
        $('#resumo').textContent = `Importando ${k + 1} de ${lista.length}: ${p.nome}…`;
        await chamar({ action: 'cadImportar', matricula: p.mat, dados: p.dados, base64: base64DeBytes(await novo.save()) }, 60000);
        p.enviar = false; k++; prog.firstElementChild.style.width = Math.round(100 * k / lista.length) + '%';
      }
      aviso(`${k} ficha(s) importadas.`);
      cadImp = null; await carregarCad(); cadVista.v = 'lista'; telaCad();
    } catch (e) { aviso('Erro: ' + e.message + ` — ${k} já foram. Clique em Importar de novo para continuar.`, true); telaCadImportar(); }
  };
}

telaPin();
</script>
